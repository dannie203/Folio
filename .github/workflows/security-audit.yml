name: Zero-Knowledge Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly every Monday at 00:00 UTC to deterministically verify crypto invariants
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  adversarial-tests:
    name: Adversarial Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Automated Adversarial Security Tests
        run: npm test
